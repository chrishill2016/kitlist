<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Club Kit</title>
    <meta name="theme-color" content="#08344a" />
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <div id="update-banner" hidden>
        A new version of Club Kit is available.
        <button type="button" id="update-reload">Reload</button>
    </div>
    <script>
        // The app is cached for offline use, so a new deploy only takes over once the user agrees to reload.
        (function () {
            if (!('serviceWorker' in navigator)) return;
            var reloading = false;
            navigator.serviceWorker.addEventListener('controllerchange', function () {
                if (!reloading) { reloading = true; location.reload(); }
            });
            navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' }).then(function (registration) {
                function offer(worker) {
                    document.getElementById('update-banner').hidden = false;
                    document.getElementById('update-reload').onclick = function () { worker.postMessage('skipWaiting'); };
                }
                if (registration.waiting && navigator.serviceWorker.controller) offer(registration.waiting);
                registration.addEventListener('updatefound', function () {
                    var worker = registration.installing;
                    worker.addEventListener('statechange', function () {
                        if (worker.state === 'installed' && navigator.serviceWorker.controller) offer(worker);
                    });
                });
                // Installed apps can stay open for days; look for new versions now and then.
                setInterval(function () { registration.update(); }, 60 * 60 * 1000);
            });
        })();
    </script>
</body>

</html>
